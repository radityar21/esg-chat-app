<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F8FAFC"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8CF7"/>
      <stop offset="100%" style="stop-color:#7C5CFC"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F8CF7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06D6A0;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.08"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4F8CF7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bgGrad)" rx="20"/>

  <!-- ═══ LEFT: User with Laptop ═══ -->
  <g transform="translate(100, 140)">
    <!-- Laptop body -->
    <rect x="0" y="50" width="80" height="55" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="5" y="55" width="70" height="40" rx="3" fill="#1E293B"/>
    <!-- Screen content (chat) -->
    <rect x="10" y="60" width="40" height="6" rx="2" fill="#4F8CF7" opacity="0.8"/>
    <rect x="10" y="70" width="55" height="4" rx="2" fill="#334155"/>
    <rect x="10" y="78" width="35" height="4" rx="2" fill="#334155"/>
    <!-- Laptop base -->
    <rect x="-10" y="105" width="100" height="8" rx="4" fill="#CBD5E1"/>
    
    <!-- Person (simple) -->
    <circle cx="40" cy="20" r="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="40" cy="16" r="8" fill="#94A3B8"/>
    <path d="M 25 32 Q 40 45 55 32" fill="#94A3B8"/>
    
    <!-- Chat bubble -->
    <g transform="translate(75, -5)">
      <rect x="0" y="0" width="90" height="35" rx="10" fill="#EFF6FF" stroke="#4F8CF7" stroke-width="1.5"/>
      <polygon points="0,20 -8,25 0,30" fill="#EFF6FF" stroke="#4F8CF7" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="12" y="15" font-size="8" fill="#4F8CF7" font-weight="600">Generate my</text>
      <text x="12" y="27" font-size="8" fill="#4F8CF7" font-weight="600">report for 2024</text>
    </g>
  </g>

  <!-- Label: ASK -->
  <text x="140" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1B3A6B">Ask</text>
  <text x="140" y="328" text-anchor="middle" font-size="9" fill="#64748B">Plain language</text>

  <!-- ═══ ARROW 1 ═══ -->
  <path d="M 240 200 C 290 200, 300 200, 340 200" stroke="url(#arrowGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="340,195 355,200 340,205" fill="#4F8CF7" opacity="0.6"/>

  <!-- ═══ CENTER: AI Cloud ═══ -->
  <g transform="translate(370, 120)" filter="url(#glow)">
    <!-- Cloud shape -->
    <ellipse cx="100" cy="85" rx="105" ry="70" fill="url(#aiGrad)" opacity="0.08"/>
    <ellipse cx="100" cy="85" rx="95" ry="60" fill="white" stroke="url(#aiGrad)" stroke-width="2"/>
    
    <!-- Brain icon center -->
    <circle cx="100" cy="70" r="22" fill="url(#aiGrad)" opacity="0.15"/>
    <text x="100" y="78" text-anchor="middle" font-size="22">🧠</text>
    
    <!-- Sub-icons around brain -->
    <!-- Data icon -->
    <circle cx="55" cy="95" r="14" fill="#EFF6FF" stroke="#4F8CF7" stroke-width="1"/>
    <text x="55" y="100" text-anchor="middle" font-size="11">📊</text>
    
    <!-- Write icon -->
    <circle cx="100" cy="115" r="14" fill="#ECFDF5" stroke="#06D6A0" stroke-width="1"/>
    <text x="100" y="120" text-anchor="middle" font-size="11">✍️</text>
    
    <!-- Check icon -->
    <circle cx="145" cy="95" r="14" fill="#F5F3FF" stroke="#7C5CFC" stroke-width="1"/>
    <text x="145" y="100" text-anchor="middle" font-size="11">✅</text>
  </g>

  <!-- Label: AI ENGINE -->
  <text x="470" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1B3A6B">AI Engine</text>
  <text x="470" y="328" text-anchor="middle" font-size="9" fill="#64748B">Gathers data • Writes • Validates</text>

  <!-- ═══ ARROW 2 ═══ -->
  <path d="M 575 200 C 620 200, 630 200, 660 200" stroke="url(#arrowGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="660,195 675,200 660,205" fill="#06D6A0" opacity="0.6"/>

  <!-- ═══ RIGHT: Document Output ═══ -->
  <g transform="translate(680, 130)" filter="url(#soft)">
    <!-- Document -->
    <rect x="20" y="10" width="90" height="120" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Fold corner -->
    <path d="M 90 10 L 110 10 L 110 30 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Content lines -->
    <rect x="32" y="30" width="50" height="5" rx="2" fill="#1B3A6B"/>
    <rect x="32" y="42" width="65" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="32" y="50" width="55" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="32" y="58" width="60" height="3" rx="1.5" fill="#CBD5E1"/>
    <!-- Table -->
    <rect x="32" y="70" width="65" height="25" rx="3" fill="#EFF6FF" stroke="#4F8CF7" stroke-width="0.5"/>
    <line x1="32" y1="80" x2="97" y2="80" stroke="#4F8CF7" stroke-width="0.5" opacity="0.4"/>
    <line x1="60" y1="70" x2="60" y2="95" stroke="#4F8CF7" stroke-width="0.5" opacity="0.4"/>
    <!-- More lines -->
    <rect x="32" y="102" width="45" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="32" y="110" width="55" height="3" rx="1.5" fill="#CBD5E1"/>
    
    <!-- Download arrow -->
    <circle cx="65" cy="145" r="16" fill="#ECFDF5" stroke="#06D6A0" stroke-width="2"/>
    <path d="M 65 138 L 65 150 M 59 146 L 65 153 L 71 146" stroke="#06D6A0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Label: DELIVER -->
  <text x="760" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1B3A6B">Download</text>
  <text x="760" y="328" text-anchor="middle" font-size="9" fill="#64748B">Formatted • Validated • Ready</text>

  <!-- Bottom tagline -->
  <rect x="250" y="355" width="400" height="32" rx="16" fill="#F0F7FF" stroke="#4F8CF7" stroke-width="1" opacity="0.8"/>
  <text x="450" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#1B3A6B">Under 5 minutes • Zero manual work • Full audit trail</text>
</svg>
